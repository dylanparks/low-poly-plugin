<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ preview</title>
<style>
  :root { --bg: #282a30; --panel: #1e2025; --text: #e2e5eb; --muted: #9aa1ad; --accent: #6ea8ff; --border: #3a3e47; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  h1 { font-size: 15px; margin: 0 8px 0 0; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .group > span { color: var(--muted); font-size: 12px; }
  button, select { font: inherit; font-size: 13px; color: var(--text); background: #2c2f37; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; min-height: 30px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button[aria-pressed="true"] { background: #33405a; border-color: var(--accent); }
  input[type=range] { width: 140px; accent-color: var(--accent); }
  main { flex: 1; position: relative; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .hint { position: absolute; left: 16px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
  #err { padding: 24px; color: #ff9b8f; }
</style>
</head>
<body>
<header>
  <h1 id="name"></h1>
  <div class="group" role="group" aria-label="Fixed views"><span>View</span><span id="views" class="group"></span></div>
  <div class="group"><span><label for="clip">Clip</label></span>
    <select id="clip"><option value="">bind pose</option></select>
    <button id="play" type="button" aria-pressed="false">Play</button>
    <span><label for="phase">Phase</label></span>
    <input id="phase" type="range" min="0" max="1" step="0.001" value="0">
    <span id="phaseval">0.00</span></div>
</header>
<main><canvas id="c" aria-label="The model, drag to turn it, scroll to zoom"></canvas>
  <div class="hint">Drag to orbit · wheel to zoom · same lights as the six-view sheet</div></main>
<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
$('name').textContent = DATA.name;
function f32(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Float32Array(u.buffer); }
function u16(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Uint16Array(u.buffer); }
const canvas = $('c'), gl = canvas.getContext('webgl', { antialias: true });
if (!gl) { document.querySelector('main').innerHTML = '<p id="err">WebGL is not available in this browser.</p>'; throw new Error('no webgl'); }
const N = DATA.count, bindP = f32(DATA.bind.p), bindN = f32(DATA.bind.n);
const clips = {}; for (const k in DATA.clips) clips[k] = { d: DATA.clips[k].d, p: f32(DATA.clips[k].p), n: f32(DATA.clips[k].n) };
// the frame of reference: the bounding box of the bind pose, or of every frame of the chosen clip
let cen = [0, 0, 0], size = 1;
function frameOn(arr) { const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (let i = 0; i < arr.length; i += 3) for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], arr[i + k]); hi[k] = Math.max(hi[k], arr[i + k]); }
  cen = lo.map((v, k) => (v + hi[k]) / 2); size = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]); }
frameOn(bindP);
const VS = `attribute vec3 p; attribute vec3 n; attribute vec2 uv; uniform vec3 cen; uniform float yaw, pitch, dist, f, aspect;
varying vec3 vn; varying vec2 vuv;
void main() { vec3 q = p - cen; float cy = cos(yaw), sy = sin(yaw), cp = cos(pitch), sp = sin(pitch);
  float d = q.z * sy + q.x * cy; float X = -(q.z * cy - q.x * sy); float Y = q.y * cp - d * sp; float Z = d * cp + q.y * sp;
  float zc = dist - Z; float nr = dist * 0.02, fr = dist * 4.0;
  gl_Position = vec4(X * f / aspect, Y * f, zc * (fr + nr) / (fr - nr) - 2.0 * fr * nr / (fr - nr), zc);
  vn = n; vuv = uv; }`;
// lit_view.py's lighting: hemisphere sky (white) and ground (bluish) at 1.2, a sun at 1.6, on a z-mirrored model
const FS = `precision mediump float; varying vec3 vn; varying vec2 vuv; uniform sampler2D tex;
void main() { vec3 n = normalize(vn); vec3 nm = vec3(n.x, n.y, -n.z); float h = 0.5 + 0.5 * nm.y;
  vec3 sun = normalize(vec3(3.0, 6.0, -4.0)); float d = max(0.0, dot(nm, sun)); vec3 gr = vec3(68.0, 80.0, 102.0) / 255.0;
  vec3 c = texture2D(tex, vuv).rgb; gl_FragColor = vec4(min(vec3(1.0), c * (1.2 * (h + (1.0 - h) * gr) + 1.6 * d)), 1.0); }`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);
function buf(data, attr, size, dyn) { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, dyn ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW);
  const l = gl.getAttribLocation(prog, attr); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, size, gl.FLOAT, false, 0, 0); return b; }
const pb = buf(bindP, 'p', 3, true), nbuf = buf(bindN, 'n', 3, true); buf(f32(DATA.uv), 'uv', 2, false);
const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); const idx = u16(DATA.idx); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([180, 180, 180, 255]));
function texParams() { gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); }
texParams();
if (DATA.tex.length > 30) { const im = new Image(); im.onload = () => { gl.bindTexture(gl.TEXTURE_2D, tx); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im); texParams(); draw(); }; im.src = DATA.tex; }
gl.enable(gl.DEPTH_TEST); gl.uniform1i(U('tex'), 0);
const cam = { yaw: 45 * Math.PI / 180, pitch: 22 * Math.PI / 180, dist: size * 1.9 };
const FOV = 35 * Math.PI / 180;
function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight, dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  gl.viewport(0, 0, canvas.width, canvas.height); gl.clearColor(40 / 255, 42 / 255, 48 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.uniform3fv(U('cen'), cen); gl.uniform1f(U('yaw'), cam.yaw); gl.uniform1f(U('pitch'), cam.pitch); gl.uniform1f(U('dist'), cam.dist);
  gl.uniform1f(U('f'), 1 / Math.tan(FOV / 2)); gl.uniform1f(U('aspect'), canvas.width / canvas.height);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
}
// the clip: baked frames, shown at the nearest frame
let clip = '', phase = 0, playing = false, last = 0;
function setFrame() {
  if (!clip) { gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, bindP); gl.bindBuffer(gl.ARRAY_BUFFER, nbuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, bindN); return; }
  const c = clips[clip], fr = Math.floor(phase * DATA.frames) % DATA.frames, o = fr * N * 3;
  gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, c.p.subarray(o, o + N * 3));
  gl.bindBuffer(gl.ARRAY_BUFFER, nbuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, c.n.subarray(o, o + N * 3));
}
for (const k in clips) { const o = document.createElement('option'); o.value = k; o.textContent = k; $('clip').appendChild(o); }
$('clip').onchange = e => { clip = e.target.value; phase = 0; frameOn(clip ? clips[clip].p : bindP); cam.dist = size * 1.9; $('phase').value = 0; showPhase(); setFrame(); draw(); };
function showPhase() { $('phaseval').textContent = phase.toFixed(2); }
$('phase').oninput = e => { phase = +e.target.value; showPhase(); setFrame(); draw(); };
$('play').onclick = () => { playing = !playing; $('play').setAttribute('aria-pressed', playing); $('play').textContent = playing ? 'Pause' : 'Play'; last = performance.now(); if (playing) requestAnimationFrame(tick); };
function tick(t) { if (!playing) return; if (clip) { phase = (phase + (t - last) / 1000 / Math.max(0.05, clips[clip].d)) % 1; $('phase').value = phase; showPhase(); setFrame(); draw(); } last = t; requestAnimationFrame(tick); }
// the six fixed views, the same yaw and pitch as the sheet
const vb = [];
DATA.views.forEach(([label, yaw, pitch]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', 'false');
  b.onclick = () => { cam.yaw = yaw * Math.PI / 180; cam.pitch = Math.min(89.9, pitch) * Math.PI / 180; vb.forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); };
  vb.push(b); $('views').appendChild(b); });
// orbit and zoom
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; cam.yaw -= (e.clientX - drag[0]) * 0.01; cam.pitch = Math.max(-1.55, Math.min(1.5707, cam.pitch + (e.clientY - drag[1]) * 0.01));
  drag = [e.clientX, e.clientY]; vb.forEach(x => x.setAttribute('aria-pressed', 'false')); draw(); });
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(size * 0.3, Math.min(size * 10, cam.dist * Math.exp(e.deltaY * 0.001))); draw(); }, { passive: false });
window.addEventListener('resize', draw);
draw();
</script>
</body>
</html>
